# ClamAV daemon settings for Dealflow (decision 63, S5). Mounted over the image's own file.
# Anything clamd can't check completely is reported (AlertExceedsMax), and Dealflow refuses it:
# the scanner fails closed rather than letting an unchecked file through.

LogTime yes
LogClean no
LogFile /var/log/clamav/clamd.log
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
ExitOnOOM yes

# Dealflow's own limits are 50 MB per Vault file, 25 MB of email attachments, 20 MB per import file.
StreamMaxLength 64M
MaxFileSize 64M
MaxScanSize 256M
AlertExceedsMax yes

# Office documents, PDFs and archives are opened and checked inside.
ScanPDF yes
ScanOLE2 yes
ScanArchive yes
ScanHTML yes
HeuristicAlerts yes
# Password-protected PDFs and archives can't be looked inside; they're accepted (bankers share them
# routinely). Set these to yes to refuse them instead.
AlertEncrypted no
