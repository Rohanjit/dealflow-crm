# Dealflow — one command to run:   docker compose up -d
# Then open http://localhost:8000 and follow the setup wizard.
#
# Postgres instead of SQLite: set DATABASE_URL in .env (see .env.example) and run
#   docker compose --profile postgres up -d

x-app: &app
  image: dealflow:latest
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    TZ: ${TZ:-Asia/Kolkata}
    DEALFLOW_KEYS_DIR: /keys
    # Every upload is checked by the virus scanner first; uploads wait while it's unavailable.
    DEALFLOW_CLAMD: clamav:3310
  volumes:
    - dealflow-data:/data
    # Keys live in their own volume, apart from the data they protect (docs/key-management.md).
    - dealflow-keys:/keys

services:
  app:
    <<: *app
    command: web
    ports:
      - "${DEALFLOW_PORT:-8000}:8000"

  scheduler:
    <<: *app
    command: scheduler
    depends_on:
      - app

  # Virus scanner (ClamAV). Needs about 1.5 GB of memory; the first start takes a few minutes while it
  # loads its signatures, and uploads are refused until it answers. Signatures update themselves.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - ./deploy/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - dealflow-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 10m

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealflow
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - dealflow-db:/var/lib/postgresql/data

volumes:
  dealflow-data:
  dealflow-keys:
  dealflow-db:
  dealflow-clamav:
